spring:
  application:
    name: zaocycle-backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zaocycle}
    username: ${DB_USERNAME:zaocycle}
    password: ${DB_PASSWORD:zaocycle}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: Africa/Nairobi
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    overwrite-existing-jobs: true
    properties:
      org:
        quartz:
          scheduler:
            instanceName: ZaoCycleScheduler
            instanceId: AUTO
          jobStore:
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            tablePrefix: QRTZ_
            isClustered: false
            misfireThreshold: 60000
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 10
            threadPriority: 5
            threadsInheritContextClassLoaderOfInitializingThread: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true

africastalking:
  api-key: ${AT_API_KEY:}
  username: ${AT_USERNAME:sandbox}
  sender-id: ${AT_SENDER_ID:ZAOCYCLE}
  base-url: ${AT_BASE_URL:https://api.sandbox.africastalking.com}
  service-code: ${AT_SERVICE_CODE:*384*5193#}

jwt:
  secret: ${JWT_SECRET}
  access-token-minutes: 15
  refresh-token-days: 30

payhero:
  base-url: ${PAYHERO_BASE_URL:https://backend.payhero.co.ke}
  basic-auth-token: ${PAYHERO_BASIC_AUTH_TOKEN}
  channel-id: ${PAYHERO_CHANNEL_ID:4240}
  stk-callback-url: ${PAYHERO_STK_CALLBACK_URL}
  withdraw-callback-url: ${PAYHERO_WITHDRAW_CALLBACK_URL}

zaocycle:
  ussd:
    session-ttl-minutes: 5
  certification:
    verify-base-url: ${VERIFY_BASE_URL:https://zaocycle.app}
    expires-after-days: 14
  notification:
    ops-phone: ${NOTIFICATION_OPS_PHONE:+254700000000}
  payment:
    rate-per-kg: ${PAYOUT_RATE_PER_KG:5.00}
  storage:
    provider: ${STORAGE_PROVIDER:SPACES}
    local-fs:
      base-path: ${LOCAL_FS_BASE:./var/storage}
      public-url-prefix: ${LOCAL_FS_URL:http://localhost:8080/files}
    spaces:
      endpoint: ${SPACES_ENDPOINT:https://sfo3.digitaloceanspaces.com}
      region: ${SPACES_REGION:sfo3}
      bucket: ${SPACES_BUCKET:sampleokoasem}
      access-key: ${SPACES_ACCESS_KEY}
      secret-key: ${SPACES_SECRET_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.newton.zaocycle: DEBUG
    org.hibernate.SQL: WARN
